# Link the Visual C++ runtime into the Windows program (#112). Without it,
# vettid-desktop.exe imports VCRUNTIME140.dll and VCRUNTIME140_1.dll, and on a
# PC without the Visual C++ runtime it doesn't start: the app doesn't open and
# the uninstaller's wipe can't run (exit 2, event 1001, the pairing kept).
# tauri-build reads this in its "msvc" arm (static_vcruntime, for debug
# builds too); other targets ignore it. Here, not in a workflow, so every
# build from this repo gets it: local, CI and release.
[env]
STATIC_VCRUNTIME = "true"
