name: calls

# The `--calls` build: the app crate with `--features webrtc` (webrtc-rs,
# cpal, Opus) on Linux, Windows and macOS. Build only. The pure call crypto
# (crypto::frame_cryptor) is tested in ci.yml without the feature.
#
# Windows minutes are billed at twice the Linux rate, so pull requests run
# this only when they touch the Rust crate, the Cargo config or this
# workflow; every push to main runs it (as windows.yml does).
#
# Opus: Linux and macOS link the system libopus (pkg-config). Windows has
# none, so audiopus_sys builds its bundled Opus with CMake; the runner's
# CMake 4 needs CMAKE_POLICY_VERSION_MINIMUM, which .cargo/config.toml sets.
#
# Actions are pinned by commit SHA (tag in the comment).

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src-tauri/**"
      - ".cargo/**"
      - ".github/workflows/calls.yml"

permissions:
  contents: read

jobs:
  calls-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      # As windows.yml: no line-ending conversion, so the tree matches Linux.
      - name: no line-ending conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: system packages (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 12
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libdbus-1-dev libtss2-dev \
            libasound2-dev libopus-dev
      - name: system packages (macOS)
        if: runner.os == 'macOS'
        run: brew install opus pkg-config
      - name: rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cmake --version || true
      # tauri::generate_context! embeds ../dist at compile time.
      - name: build frontend
        run: |
          npm ci
          npm run build
      - name: cargo build --features webrtc
        run: cargo build --manifest-path src-tauri/Cargo.toml --locked -p vettid-desktop --features webrtc
