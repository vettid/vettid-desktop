name: calls

# The `--calls` build: the app crate with `--features webrtc` (webrtc-rs,
# cpal, Opus) on Linux, Windows and macOS, plus the dtls / rustls
# process-default test (vettid-relay). The pure call crypto
# (crypto::frame_cryptor) is tested in ci.yml without the feature.
#
# Windows minutes are billed at twice the Linux rate, so pull requests run
# this only when they touch the Rust crate, the Cargo config or this
# workflow; every push to main runs it (as windows.yml does).
#
# Opus: Linux and macOS link the system libopus (pkg-config). Windows has
# none, so audiopus_sys builds its bundled Opus with CMake; the runner's
# CMake 4 needs CMAKE_POLICY_VERSION_MINIMUM, which .cargo/config.toml sets.
#
# Actions are pinned by commit SHA (tag in the comment).

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src-tauri/**"
      - ".cargo/**"
      - ".github/workflows/calls.yml"

permissions:
  contents: read

jobs:
  calls-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # aws-lc-sys (the relay client's TLS) on Windows: build its assembly
      # with NASM (installed below), never the prebuilt objects.
      AWS_LC_SYS_PREBUILT_NASM: "0"
    defaults:
      run:
        shell: bash
    steps:
      # As windows.yml: no line-ending conversion, so the tree matches Linux.
      - name: no line-ending conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: system packages (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 12
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libdbus-1-dev libtss2-dev \
            libasound2-dev libopus-dev
      - name: system packages (macOS)
        if: runner.os == 'macOS'
        run: brew install opus pkg-config
      - name: NASM 2.16.03 (Windows, checksum-verified, for aws-lc-sys)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # nasm.us's x64 installer, checked against the SHA-256 the
          # Chocolatey nasm 2.16.3 package records for that exact file
          # (its tools/VERIFICATION.txt), then installed silently.
          $url = 'https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/win64/nasm-2.16.03-installer-x64.exe'
          $want = '657E1252676CFB26A008835C20A760F731C8E0414469A4ED0F83F0FB059CDD35'
          Invoke-WebRequest -Uri $url -OutFile nasm-setup.exe
          $got = (Get-FileHash nasm-setup.exe -Algorithm SHA256).Hash
          if ($got -ne $want) { throw "NASM installer SHA-256 $got, expected $want" }
          Start-Process -FilePath .\nasm-setup.exe -ArgumentList '/S' -Wait
          Remove-Item nasm-setup.exe
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\NASM'
      - name: NASM version (Windows)
        if: runner.os == 'Windows'
        run: nasm -v
      - name: rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cmake --version || true
      # tauri::generate_context! embeds ../dist at compile time.
      - name: build frontend
        run: |
          npm ci
          npm run build
      - name: cargo build --features webrtc
        run: cargo build --manifest-path src-tauri/Cargo.toml --locked -p vettid-desktop --features webrtc
      # With webrtc, rustls has ring (dtls) and aws-lc-rs compiled in, so no
      # automatic default: dtls's verifiers need the process default that
      # run() installs. This test builds dtls with both providers, panics
      # without the default, and completes a DTLS handshake with it.
      - name: dtls with both rustls providers (process default)
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked -p vettid-relay --test dtls_default_provider
