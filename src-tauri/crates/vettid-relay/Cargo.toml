[package]
name = "vettid-relay"
version = "0.1.0"
edition = "2021"
description = "VettID relay client: request signing, mailbox ids and deposit tokens (RELAY-PROTOCOL)"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
ed25519-dalek = "2"
# PASETO v4.public (MIT). Only v4: no v2, no PASERK, no serde/time.
pasetors = { version = "0.8", default-features = false, features = ["v4"] }
sha2 = "0.10"
base64 = "0.22"
data-encoding = "2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
zeroize = "1"
# The transport. reqwest as the app uses it (rustls, no native TLS).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["time"] }
rand = "0.8"

[features]
# DEVELOPMENT ONLY: reach the local dev stack's relay (relay.vettid.test
# at its loopback TLS front, trusting only the stack's TEST-ONLY root).
# lib.rs and build.rs refuse it in any release or optimized build, and CI
# checks that and that the app can't enable it.
dev-relay = []

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
