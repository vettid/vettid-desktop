[package]
name = "vettid-vms"
version = "0.1.0"
edition = "2021"
description = "VettID messaging (VAULT-MESSAGING suite 2): KEM, HPKE, session AEAD, kids, signatures, the v2 envelope and strict JSON"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
# HPKE (RFC 9180) with X-Wing, KEM MLKEM768X25519 (0x647a), by the owner's
# decision: a maintained crate, no hand-written HPKE. hpke 0.15.1 (rozbb,
# MIT/Apache-2.0) on RustCrypto's x-wing 0.1.1 and ml-kem (MIT/Apache-2.0).
# "getrandom" gives hpke::setup_sender its own OS randomness.
hpke = { version = "0.15", default-features = false, features = ["alloc", "getrandom", "mlkem", "x25519", "chacha", "hkdfsha2"] }
# Pinned exactly: pre-1.0 and tracking an IETF draft. Re-run the vectors
# (cargo test -p vettid-vms) on any bump.
x-wing = "=0.1.1"
chacha20poly1305 = "0.10"
# Only its x25519 function, for the low-order check (as Go's ecdh refuses
# an all-zero shared secret). Version 3, the copy x-wing already uses.
x25519-dalek = "3"
sha2 = "0.10"
ed25519-dalek = "2"
rand = "0.8"
subtle = "2"
zeroize = { version = "1", features = ["derive"] }
# Canonical standard base64 (strict JSON members) and the inner timestamps.
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[dev-dependencies]
hex = "0.4"
hkdf = "0.12"
rand_core = "0.10"
serde_json = "1"
vettid-relay = { path = "../vettid-relay" }
