[package]
name = "vettid-relay"
version = "0.1.0"
edition = "2021"
description = "VettID relay client: request signing, mailbox ids and deposit tokens (RELAY-PROTOCOL)"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
ed25519-dalek = "2"
# PASETO v4.public (MIT). Only v4: no v2, no PASERK, no serde/time.
pasetors = { version = "0.8", default-features = false, features = ["v4"] }
sha2 = "0.10"
base64 = "0.22"
data-encoding = "2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
zeroize = "1"
# The transport. reqwest as the app uses it (rustls, no native TLS). No
# crypto provider of reqwest's own: every client gets the aws-lc-rs
# configuration from `tls` (hybrid post-quantum key exchange first).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-no-provider"] }
# aws-lc-rs and its default groups, X25519MLKEM768 first. No `logging`:
# rustls writes nothing to the log.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "prefer-post-quantum", "std", "tls12"] }
webpki-roots = "1"
tokio = { version = "1", features = ["time"] }
rand = "0.8"

[features]
# DEVELOPMENT ONLY: reach the local dev stack's relay (relay.vettid.test
# at its loopback TLS front, trusting only the stack's TEST-ONLY root).
# lib.rs and build.rs refuse it in any release or optimized build, and CI
# checks that and that the app can't enable it.
dev-relay = []

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }
# TEST-ONLY certificates for the handshake tests in `tls`.
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs", "crypto"] }
# A TLS server for the reqwest handshake test in `tls`.
tokio-rustls = { version = "0.26", default-features = false }
# tests/dtls_default_provider.rs: dtls as the calls build has it, which
# also turns on rustls's ring provider in this crate's test build (a
# dev-dependency: it never reaches the app's own build).
dtls = "0.17"
webrtc-util = { version = "0.17", default-features = false, features = ["conn"] }
