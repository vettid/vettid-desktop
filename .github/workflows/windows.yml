name: windows

# Windows build and tests (#6, owner decision (a), 2026-11-01). Windows
# minutes are billed at twice the Linux rate, so pull requests run this only
# when they touch the Rust crate or this workflow; every push to main runs it.
# The frontend's own job in ci.yml covers frontend-only changes.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src-tauri/**"
      - ".cargo/**"
      - "scripts/windows/check-no-vcruntime.ps1"
      - ".github/workflows/windows.yml"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      AWS_LC_SYS_PREBUILT_NASM: "0"
    defaults:
      run:
        shell: bash
    steps:
      # The repository is checked out without line-ending conversion, as on
      # the Windows test machine, so the tree matches Linux byte for byte.
      - name: no line-ending conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
      # aws-lc-sys (the relay client's TLS) assembles with NASM. Without it
      # it would link the prebuilt objects in the crate; with
      # AWS_LC_SYS_PREBUILT_NASM=0 a missing NASM fails the build instead.
      - name: NASM 2.16.03 (checksum-verified, for aws-lc-sys)
        shell: pwsh
        run: |
          # nasm.us's x64 installer, checked against the SHA-256 the
          # Chocolatey nasm 2.16.3 package records for that exact file
          # (its tools/VERIFICATION.txt), then installed silently.
          $url = 'https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/win64/nasm-2.16.03-installer-x64.exe'
          $want = '657E1252676CFB26A008835C20A760F731C8E0414469A4ED0F83F0FB059CDD35'
          Invoke-WebRequest -Uri $url -OutFile nasm-setup.exe
          $got = (Get-FileHash nasm-setup.exe -Algorithm SHA256).Hash
          if ($got -ne $want) { throw "NASM installer SHA-256 $got, expected $want" }
          Start-Process -FilePath .\nasm-setup.exe -ArgumentList '/S' -Wait
          Remove-Item nasm-setup.exe
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\NASM'
      - name: NASM version
        run: nasm -v
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: windows-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: windows-cargo-
      - name: npm ci
        run: npm ci
      - name: svelte-check
        run: npm run check
      # tauri::generate_context! embeds ../dist at compile time, so the
      # frontend has to be built before the crate compiles.
      - name: build frontend
        run: npm run build
      # The tests use the real Windows APIs on the runner: file DACLs and
      # ownership, junctions and hard links, rename by handle, and the
      # Credential Manager (written, read and deleted under a target name of
      # each test's own). None is marked #[ignore]. A few fingerprint tests
      # check nothing on a machine with fewer than three attributes; the
      # Windows collector test is strict and fails then. Tests that would
      # need a second Windows account don't exist yet.
      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      # The program must not need the Visual C++ runtime, which a fresh
      # Windows doesn't have (#112): without it the app doesn't start, and the
      # uninstaller's wipe can't run. .cargo/config.toml sets STATIC_VCRUNTIME;
      # this fails if the built program imports a VCRUNTIME DLL anyway.
      - name: no Visual C++ runtime DLL needed (#112)
        shell: pwsh
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/windows/check-no-vcruntime.ps1 src-tauri/target/debug/vettid-desktop.exe
          exit $LASTEXITCODE
