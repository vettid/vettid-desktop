name: calls-probe

# Throwaway probe for #139 (not for merge): build the app crate with
# --features webrtc (a `--calls` build) on Linux, Windows and macOS, and run
# the calls and frame-crypto unit tests against the dtls 0.17.3 lockfile.

on:
  pull_request:

permissions:
  contents: read

jobs:
  calls:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # audiopus_sys 0.2.2's bundled Opus asks for CMake < 3.5, which CMake 4
      # refuses (Windows builds Opus from source); CMake's own suggested override.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    defaults:
      run:
        shell: bash
    steps:
      - name: no line-ending conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libdbus-1-dev libtss2-dev \
            libasound2-dev libopus-dev cmake
      - name: system packages (macOS)
        if: runner.os == 'macOS'
        run: brew install opus pkg-config
      - name: rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
      - name: build frontend
        run: |
          npm ci
          npm run build
      - name: cargo build --features webrtc (a --calls build)
        run: cargo build --manifest-path src-tauri/Cargo.toml --locked -p vettid-desktop --features webrtc
      - name: calls and frame-crypto tests (--features webrtc)
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked -p vettid-desktop --features webrtc --lib -- webrtc:: crypto::
      - name: dtls and crypto-bigint versions in this build
        run: cargo tree --manifest-path src-tauri/Cargo.toml --locked -p vettid-desktop --features webrtc -i crypto-bigint -e normal --depth 4
