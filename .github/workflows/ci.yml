name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      # User-facing text is American English (owner decision, 2026-11-05).
      - name: spelling (American English in user-facing text)
        run: sh scripts/check-spelling.sh
      - name: npm ci
        run: npm ci
      - name: svelte-check
        run: npm run check
      - name: frontend tests (node --test)
        run: npm test
      - name: vite build
        run: npm run build

  rust:
    # Linux. Windows has its own workflow, windows.yml (#6).
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libdbus-1-dev libtss2-dev
      - name: rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
      # tauri::generate_context! embeds ../dist at compile time, so the
      # frontend has to be built before the crate compiles.
      - name: build frontend
        run: |
          npm ci
          npm run build
      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      # The Linux protectors (#13) against a software TPM and a session bus
      # with no Secret Service. These tests are #[ignore]d (they need swtpm
      # and dbus-daemon), so they are named here and run explicitly; the
      # count check fails the step if any of them is renamed or skipped.
      - name: TPM and Secret Service tests (swtpm, dbus-daemon)
        shell: bash
        run: |
          sudo apt-get install -y --no-install-recommends swtpm dbus-daemon
          tests=(
            credential::tpm::tests::tpm_round_trip_against_swtpm
            credential::tpm::tests::tpm_uses_the_persistent_srk_when_there
            credential::tpm::tests::tpm_a_blob_from_another_tpm_wont_open
            credential::tpm::tests::tpm_an_owner_auth_value_is_failing
            credential::tpm::tests::tpm_the_unpinned_format_is_refused
            credential::tpm::tests::tpm_a_replaced_srk_wont_open
            credential::device_store::tests::linux_round_trip_through_the_tpm
            credential::secret_service::tests::a_bus_without_a_secret_service_is_absent
          )
          cargo test --manifest-path src-tauri/Cargo.toml --locked -p vettid-desktop --lib -- --ignored --exact --test-threads=1 "${tests[@]}" | tee ignored.log
          grep -q "test result: ok. ${#tests[@]} passed" ignored.log
      # The messaging crate's clippy.toml disallows the HPKE functions that
      # take caller randomness outside its tests; -D warnings makes a use
      # an error.
      - name: clippy (vettid-vms)
        run: |
          rustup component add clippy
          cargo clippy --manifest-path src-tauri/Cargo.toml -p vettid-vms --all-targets --locked -- -D warnings
      - name: clippy (vettid-device)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -p vettid-device --all-targets --locked -- -D warnings
      # The dev-only plain-file key store: tested in debug builds; refused in
      # any release or optimized build, by lib.rs (no debug_assertions) and
      # build.rs (profile release or opt-level above 0), also when the
      # release profile is given debug assertions; and never enabled by the
      # app, whatever its features.
      - name: dev key store gate (vettid-device)
        shell: bash
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml -p vettid-device --features dev-file-store --locked
          for env in "" "CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS=true"; do
            if env $env cargo check --manifest-path src-tauri/Cargo.toml -p vettid-device --features dev-file-store --release --locked 2> release.log; then
              echo "a release build accepted the dev-file-store feature ($env)"; exit 1
            fi
            grep -q "for development builds only" release.log
          done
          tree=$(cargo tree --manifest-path src-tauri/Cargo.toml -p vettid-desktop -e features --all-features --locked)
          if grep -q "dev-file-store" <<< "$tree"; then
            echo "the app can enable the dev-file-store feature"; exit 1
          fi
          if grep -Eq '^[[:space:]]*debug-assertions[[:space:]]*=[[:space:]]*true' src-tauri/Cargo.toml; then
            echo "a profile in src-tauri/Cargo.toml enables debug-assertions"; exit 1
          fi

      - name: dev relay gate (vettid-relay, vettid-device)
        shell: bash
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml -p vettid-relay --features dev-relay --locked
          cargo clippy --manifest-path src-tauri/Cargo.toml -p vettid-relay -p vettid-device --features vettid-relay/dev-relay,vettid-device/dev-relay --all-targets --locked -- -D warnings
          # build.rs refuses release and optimized builds; a build without
          # debug assertions reaches lib.rs's compile_error!. vettid-device's
          # feature turns on vettid-relay's, whose checks fire first: the
          # refusal is redundant there, by design.
          for pkg in vettid-relay vettid-device; do
            for env in "--release" "--release CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS=true" "CARGO_PROFILE_DEV_DEBUG_ASSERTIONS=false"; do
              set -- $env
              flags=""; vars=""
              for w in "$@"; do case $w in --*) flags="$flags $w";; *) vars="$vars $w";; esac; done
              if env $vars cargo check --manifest-path src-tauri/Cargo.toml -p $pkg --features dev-relay $flags --locked 2> release.log; then
                echo "a build of $pkg ($env) accepted the dev-relay feature"; exit 1
              fi
              grep -q "for development builds only" release.log
            done
          done
          tree=$(cargo tree --manifest-path src-tauri/Cargo.toml -p vettid-desktop -e features --all-features --locked)
          # (The app depends on vettid-device, and so on vettid-relay: neither's
          # dev feature may reach it. `devstack`, the removed plain-HTTP
          # feature, stays in the pattern on purpose, so it can't come back
          # unnoticed.)
          if grep -Eq "dev-relay|devstack" <<< "$tree"; then
            echo "the app can enable the dev-relay feature"; exit 1
          fi

  gitleaks:
    # Pinned binary over the FULL history (the gitleaks-action fails on a
    # branch's first push, where there is no "before" commit).
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: install gitleaks v8.30.1 (checksum-verified)
        run: |
          curl -sSLo gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks
      - name: scan full history
        run: ./gitleaks git --redact --verbose .
