[package]
name = "vettid-relay"
version = "0.1.0"
edition = "2021"
description = "VettID relay client: request signing, mailbox ids and deposit tokens (RELAY-PROTOCOL)"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
ed25519-dalek = "2"
sha2 = "0.10"
base64 = "0.22"
data-encoding = "2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
