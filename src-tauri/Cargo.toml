[package]
name = "vettid-desktop"
version = "0.1.0"
edition = "2021"
description = "VettID Desktop Client"
license = "AGPL-3.0-or-later"

# The protocol crates (relay client, messaging) live in their own crates, so
# they build and test without the Tauri app. `cargo test` here runs them too.
[workspace]
members = [".", "crates/vettid-relay", "crates/vettid-vms", "crates/vettid-device"]
default-members = [".", "crates/vettid-relay", "crates/vettid-vms", "crates/vettid-device"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# SECURITY: `devtools` is INTENTIONALLY not in this list. Enabling the
# Tauri `devtools` Cargo feature exposes the WebView inspector in every
# build of the binary — including release — regardless of
# debug_assertions. A local-process attacker with the WebView open can
# hook the JS↔Rust invoke bridge and call any Tauri command after the
# auto-unlock has loaded the connection key. Enable explicitly with
# `--features devtools` (already wired in scripts/install-local.sh for
# --debug builds). Never add it back to default.
# See SECURITY-REVIEW-2026-05-25.md D-HIGH-1.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
# Single-instance: a second launch of the binary doesn't open a new
# window — it fires a callback in the running process so we can focus
# the existing window instead. Prevents two VettID Desktops running at
# the same time on the same user, which would race on the same relay
# mailbox and credential store.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

# Crypto
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
argon2 = "0.5"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }

# The device engine: pairing and sessions with the vault, over the relay
# (VAULT-MESSAGING; crates/vettid-device). None of its development-only
# features (dev-file-store, dev-relay) may be enabled here: CI checks.
vettid-device = { path = "crates/vettid-device" }

# HTTP
# Use rustls-tls instead of native-tls so the app has a single TLS stack,
# the one the relay client (crates/vettid-relay) uses. Saves a few MB of
# binary too.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Hex encoding
hex = "0.4"

# Base64
base64 = "0.22"

# WebRTC (peer connection, SDP/ICE, audio/video tracks). Behind a feature
# flag so dev builds without calling stay quick — `cargo tauri build
# --features webrtc` to enable.
webrtc = { version = "0.17", optional = true }
async-trait = { version = "0.1", optional = true }
# Audio capture (microphone) for the WebRTC audio track. cpal handles the
# OS-specific audio backends (CoreAudio on macOS, ALSA/PulseAudio on Linux);
# opus + bytes encode the captured PCM into RTP-friendly Opus frames.
cpal = { version = "0.15", optional = true }
opus = { version = "0.3", optional = true }
bytes = { version = "1", optional = true }
# Frame cryptor (interop with Android's libwebrtc FrameCryptor) — AES-128-GCM
# over the codec payload, with the AES key derived by PBKDF2 over the
# per-call shared secret. Kept unconditional (not gated under the `webrtc`
# feature) so the pure functions in crypto/frame_cryptor.rs stay testable
# without pulling in cpal/ALSA. The interceptor wiring that actually uses
# them at runtime is webrtc-feature-gated. See crypto/frame_cryptor.rs.
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Platform / filesystem
hostname = "0.4"
dirs = "5"
serde_bytes = "0.11"

# Win32 calls for the Windows machine fingerprint (registry, disk serial,
# network adapters), DPAPI (Win32_Security_Cryptography: the device file's
# protector; NetManagement, GroupPolicy and UI_Shell for its domain and
# roaming-profile notices) and deleting the earlier format's Credential Manager entry. See
# fingerprint/platform_windows.rs, credential/dpapi.rs and credential/wincred.rs. Wdk_Storage_FileSystem
# is for NtSetInformationFile: renaming the pairing by handle, relative to its
# folder's handle (credential/winacl.rs, #28).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_NetManagement",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_GroupPolicy",
    "Win32_System_IO",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

# geteuid, for checking who owns the pairing folder (credential/store.rs, #28).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# macOS: the OS keyring (the login keychain) holds the device file's data
# key, the interim protector until the keychain and passphrase ones (#13;
# credential/protector.rs). Windows uses DPAPI and Linux the TPM or the
# Secret Service, so neither builds this crate.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

# Linux protectors (#13, credential/tpm.rs and credential/secret_service.rs):
# - tss-esapi: the TPM 2.0 through /dev/tpmrm0. It links libtss2 (esys,
#   tctildr, mu, sys; 2.4.6 or later), which becomes a runtime dependency of
#   the package; built and tested against 4.1.3.
# - dbus-secret-service: the Secret Service (the plan's choice (b)), with its
#   D-Bus session encrypted (`crypto-rust`); dbus, for checking that a
#   session bus and `org.freedesktop.secrets` are there before using it.
#   Both were already in the tree, through `keyring`.
[target.'cfg(target_os = "linux")'.dependencies]
tss-esapi = "7.7"
dbus = "0.9"
dbus-secret-service = { version = "4.1", features = ["crypto-rust"] }

[dev-dependencies]
tempfile = "3"
# Paused time, for the link loop's tests.
tokio = { version = "1", features = ["full", "test-util"] }
# A fake vault for the link's tests (src/link/fake.rs).
vettid-vms = { path = "crates/vettid-vms" }
vettid-relay = { path = "crates/vettid-relay" }
ed25519-dalek = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Enable the WebView devtools (Inspect Element). SECURITY: opt-in only,
# never include in `default` and never in a release build. See the note
# on the tauri dependency above and SECURITY-REVIEW-2026-05-25.md D-HIGH-1.
devtools = ["tauri/devtools"]
# Enable real WebRTC media. Without this, call signaling still works but no
# audio/video flows — useful for testing the call UX without paying the
# webrtc-rs compile cost (~5–10 min on a clean build).
webrtc = ["dep:webrtc", "dep:async-trait", "dep:cpal", "dep:opus", "dep:bytes"]
