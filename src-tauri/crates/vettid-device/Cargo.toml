[package]
name = "vettid-device"
version = "0.1.0"
edition = "2021"
description = "VettID device engine: pairing a desktop with its vault (VAULT-MESSAGING §6.7) over the relay"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
vettid-relay = { path = "../vettid-relay" }
vettid-vms = { path = "../vettid-vms" }
ed25519-dalek = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
zeroize = "1"
rand = "0.8"
base64 = "0.22"
hex = "0.4"
# Retry backoff during pairing.
tokio = { version = "1", features = ["time"] }

[features]
# A plain-file key store for development only. It must never be in a
# release build: lib.rs refuses to compile it without debug_assertions,
# and CI checks both that and that the app doesn't enable it.
dev-file-store = []
# DEVELOPMENT ONLY: the local dev stack's relay (vettid-relay's
# dev-relay), refused in release builds like dev-file-store.
dev-relay = ["vettid-relay/dev-relay"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
serde_json = "1"
sha2 = "0.10"
# The dev stack test drives the stack's control port (tests/devstack.rs).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
